[package]
name = "beatman"
version = "0.1.0"
edition = "2021"

[dependencies]
sha2 = "0.11"
log = "0.4.33"
env_logger = "0.11.11"
reqwest = { version = "0.13", features = ["blocking", "json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = "8.6"
jwalk = "0.9"
rayon = "1.12"
clap = { version = "4.6.6", features = ["derive"] }
encoding_rs = "0.8.35"
regex = "1.13"
chrono = "0.4.45"
strum = "0.28.0"
strum_macros = "0.28.0"
md-5 = "0.11.0"
unrar = "0.5.8"

[dependencies.rusqlite]
version = "0.40.2"
features = ["bundled"]
